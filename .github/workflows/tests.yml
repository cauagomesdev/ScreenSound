name: Executar Testes

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependências
        run: dotnet restore ScreenSound.sln

      - name: Executar testes e gerar cobertura
        run: dotnet test ScreenSound.sln --logger "trx;LogFileName=resultado.trx" --collect:"XPlat Code Coverage" --filter Categoria=Integracao

      - name: Salvar relatório de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-teste
          path: "**/resultado.trx"

      - name: Gerar relatório de cobertura
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.6.0
          reportgenerator \
            -reports:"**/TestResults/*/coverage.cobertura.xml" \
            -targetdir:relatorio-cobertura \
            -reporttypes:"Html;MarkdownSummaryGithub"
          cat relatorio-cobertura/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Salvar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-cobertura
          path: relatorio-cobertura
