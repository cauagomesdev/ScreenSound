name: Executar Testes

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Arquivo gerado pelo coverlet (o nome da subpasta é um GUID, por isso o "*")
      coverage_file: ScreenSound.Tests.Integracao/TestResults/*/coverage.cobertura.xml
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependências
        run: dotnet restore ScreenSound.sln

      - name: Executar testes e gerar cobertura
        run: dotnet test ScreenSound.sln --no-restore --logger "trx;LogFileName=resultado.trx" --collect:"XPlat Code Coverage" --filter Categoria=Integracao

      - name: Salvar relatório de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-teste
          path: "**/resultado.trx"

      - name: Instalar ReportGenerator
        if: always()
        run: dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.6.1

      - name: Gerar relatório de cobertura
        if: always()
        run: |
          reportgenerator -reports:"${{ env.coverage_file }}" -targetdir:"ScreenSound.Tests.Integracao/RelatorioCobertura" -reporttypes:"Html;MarkdownSummaryGithub"
          cat ScreenSound.Tests.Integracao/RelatorioCobertura/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Listar arquivos do relatório
        if: always()
        run: ls ScreenSound.Tests.Integracao/RelatorioCobertura

      - name: Upload do artefato do relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-cobertura
          path: ScreenSound.Tests.Integracao/RelatorioCobertura
