name: .NET

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-e-testes:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Configurar o .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restaurar pacotes
        run: dotnet restore ScreenSound.sln

      - name: Compilar
        run: dotnet build ScreenSound.sln --no-restore --configuration Release

      - name: Testes unitários
        run: dotnet test ScreenSound.Tests.Unitarios --no-build --configuration Release --verbosity normal

      - name: Testes de integração
        run: dotnet test ScreenSound.Tests.Integracao --no-build --configuration Release --verbosity normal
